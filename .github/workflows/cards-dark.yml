name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
     
      - name: Generate cards for my repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: domdfcoding
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}          
      
      - name: Generate cards for repo-helper's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: repo-helper
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}          
      
      - name: Generate cards for sphinx-toolbox's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: sphinx-toolbox
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}          
      
      - name: Generate cards for python-coincidence's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: python-coincidence
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}          
     
      - name: Generate cards for PyMassSpec's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: PyMassSpec
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}   
      
      - name: Generate cards for python-formate's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: python-formate
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}          
      
      - name: Generate cards for GunShotMatch's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: GunShotMatch
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}              
     
      - name: Generate cards for potbanksoftware's repositories
        uses: domdfcoding/github-readme-stats-action@v2-all-repos
        with:
          username: potbanksoftware
          options: theme=dark&locale=&show_owner=true&description_lines_count=2
          path: dark
          token: ${{ secrets.GITHUB_TOKEN }}          
     
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dark/*.svg
          git commit -m "Update README cards" || exit 0
          git push
